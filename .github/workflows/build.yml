name: Manual Windows Build

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击运行

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        config: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      # 显式指定构建类型，确保输出目录是 Release
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}

    - name: Build with MSVC
      # 使用 --config 指定配置，这对于 Visual Studio 生成器至关重要
      run: cmake --build build --config ${{ matrix.config }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Launchpad-RGB-Ambient-Windows-${{ matrix.config }}
        # 这里的路径必须与 CMakeLists.txt 中的 CMAKE_RUNTIME_OUTPUT_DIRECTORY 完全一致
        path: |
          bin/Release/*.exe
