name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, "0.2" ]
  pull_request:
    branches: [ main, "0.2" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          cl /nologo /O2 /std:c++17 /EHsc /utf-8 ^
            src\main.cpp ^
            src\app\application.cpp ^
            src\core\color.cpp ^
            src\effects\effect_engine.cpp ^
            src\hardware\midi_output.cpp ^
            src\localization\localization.cpp ^
            src\monitor\system_monitor.cpp ^
            src\ui\main_window.cpp ^
            /link user32.lib gdi32.lib winmm.lib comctl32.lib pdh.lib ^
            /SUBSYSTEM:WINDOWS /OUT:Launchpad_RGB_Ambient_v0.2.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Launchpad_RGB_Ambient_v0.2
          path: Launchpad_RGB_Ambient_v0.2.exe
