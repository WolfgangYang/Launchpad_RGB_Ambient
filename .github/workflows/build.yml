name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          cl /nologo /O2 /std:c++17 /utf-8 src\main.cpp /link user32.lib gdi32.lib winmm.lib comctl32.lib pdh.lib /SUBSYSTEM:WINDOWS /OUT:Launchpad_RGB_Ambient_v0.1.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Launchpad_RGB_Ambient_v0.1
          path: Launchpad_RGB_Ambient_v0.1.exe
